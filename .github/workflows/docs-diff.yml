name: Docs Diff

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Cancel in-progress runs for the same PR
concurrency:
  group: docs-diff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  docs-diff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Docs Diff
        uses: ./
        with:
          production-url: https://developers.webflow.com  # Change to your production docs URL
          fern-token: ${{ secrets.FERN_TOKEN }}
          # preview-url: ''  # Leave empty to auto-generate via Fern CLI
          # filter: '/api-reference'
          # concurrency: '10'
          # diff-threshold: '2'
          # check-header: 'false'
          # check-sidebar: 'false'
          # check-footer: 'false'
