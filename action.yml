name: 'Docs Migration Diff'
description: 'Compare production docs against a Fern preview deployment and report visual/structural/text differences'

inputs:
  production-url:
    description: 'Production docs URL (e.g. https://developers.webflow.com)'
    required: true
  preview-url:
    description: 'Preview docs URL (if not provided, runs fern generate --docs --preview to get one)'
    required: false
    default: ''
  fern-token:
    description: 'Fern token for generating preview (required if preview-url is not provided)'
    required: false
    default: ''
  sitemap-url:
    description: 'Custom sitemap URL (defaults to production-url/sitemap.xml)'
    required: false
    default: ''
  filter:
    description: 'Only check pages matching this path pattern (e.g. /api-reference)'
    required: false
    default: ''
  concurrency:
    description: 'Number of parallel page comparisons'
    required: false
    default: '10'
  diff-threshold:
    description: 'Pixel diff percentage threshold for embedding images in report'
    required: false
    default: '2'
  check-header:
    description: 'Include header elements in comparisons'
    required: false
    default: 'false'
  check-sidebar:
    description: 'Include sidebar elements in comparisons'
    required: false
    default: 'false'
  check-footer:
    description: 'Include footer elements in comparisons'
    required: false
    default: 'false'

outputs:
  preview-url:
    description: 'The preview URL used for comparison'
    value: ${{ steps.resolve-preview.outputs.preview-url }}
  has-changes:
    description: 'Whether any pages have changes (true/false)'
    value: ${{ steps.run-diff.outputs.has-changes }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install diff tool dependencies
      shell: bash
      run: npm ci
      working-directory: ${{ github.action_path }}

    - name: Resolve preview URL
      id: resolve-preview
      shell: bash
      run: |
        if [ -n "${{ inputs.preview-url }}" ]; then
          echo "preview-url=${{ inputs.preview-url }}" >> "$GITHUB_OUTPUT"
          echo "Using provided preview URL: ${{ inputs.preview-url }}"
        else
          echo "No preview URL provided — generating via Fern CLI..."
          npm install -g fern-api
          OUTPUT=$(fern generate --docs --preview 2>&1) || true
          echo "$OUTPUT"
          URL=$(echo "$OUTPUT" | grep -oP 'Published docs to \K.*(?= \()')
          if [ -z "$URL" ]; then
            echo "::error::Failed to extract preview URL from fern output"
            exit 1
          fi
          echo "preview-url=$URL" >> "$GITHUB_OUTPUT"
          echo "Generated preview URL: $URL"
        fi
      env:
        FERN_TOKEN: ${{ inputs.fern-token }}

    - name: Run docs diff
      id: run-diff
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        PREVIEW_URL="${{ steps.resolve-preview.outputs.preview-url }}"
        ARGS="${{ inputs.production-url }} $PREVIEW_URL"

        if [ -n "${{ inputs.sitemap-url }}" ]; then
          ARGS="$ARGS ${{ inputs.sitemap-url }}"
        fi

        if [ -n "${{ inputs.filter }}" ]; then
          ARGS="$ARGS --filter=${{ inputs.filter }}"
        fi

        ARGS="$ARGS --concurrency=${{ inputs.concurrency }}"
        ARGS="$ARGS --diff-threshold=${{ inputs.diff-threshold }}"

        if [ "${{ inputs.check-header }}" = "true" ]; then
          ARGS="$ARGS --check-header"
        fi

        if [ "${{ inputs.check-sidebar }}" = "true" ]; then
          ARGS="$ARGS --check-sidebar"
        fi

        if [ "${{ inputs.check-footer }}" = "true" ]; then
          ARGS="$ARGS --check-footer"
        fi

        ARGS="$ARGS --ci"

        node upgrade-diff.js $ARGS

        # Set output from CI summary
        if [ -f upgrade-diff-ci-summary.json ]; then
          STRUCT=$(jq '.counts.structureChanged' upgrade-diff-ci-summary.json)
          TEXT=$(jq '.counts.textChanged' upgrade-diff-ci-summary.json)
          if [ "$((STRUCT + TEXT))" -gt 0 ]; then
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
          fi
        fi

    - name: Upload report artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: docs-diff-report
        path: |
          ${{ github.action_path }}/upgrade-diff-share-*.html
          ${{ github.action_path }}/upgrade-diff-ci-summary.json
        retention-days: 30

    - name: Comment on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');

          const summaryPath = path.join('${{ github.action_path }}', 'upgrade-diff-ci-summary.json');
          if (!fs.existsSync(summaryPath)) {
            core.warning('No CI summary found — skipping PR comment');
            return;
          }

          const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
          const { counts, changedPages } = summary;
          const total = counts.total;
          const hasChanges = counts.structureChanged + counts.textChanged > 0;
          const previewUrl = '${{ steps.resolve-preview.outputs.preview-url }}';

          let body = `## Docs Diff Report\n\n`;
          body += `**Production:** ${{ inputs.production-url }}\n`;
          body += `**Preview:** ${previewUrl}\n\n`;
          body += `| Category | Count |\n`;
          body += `|----------|-------|\n`;
          body += `| Structure Changed | ${counts.structureChanged} |\n`;
          body += `| Text Changed | ${counts.textChanged} |\n`;
          body += `| Unchanged | ${counts.unchanged} |\n`;
          body += `| Errors | ${counts.error} |\n`;
          body += `| **Total** | **${total}** |\n\n`;

          if (hasChanges && changedPages.length > 0) {
            body += `### Changed Pages\n\n`;
            body += `| Page | Status | Pixel Diff |\n`;
            body += `|------|--------|------------|\n`;
            for (const p of changedPages.slice(0, 50)) {
              const diff = p.diffPercent !== null ? `${p.diffPercent}%` : 'N/A';
              const status = p.classification === 'structure-changed' ? '🔴 Structure' : '🟡 Text';
              body += `| \`${p.path}\` | ${status} | ${diff} |\n`;
            }
            if (changedPages.length > 50) {
              body += `\n_...and ${changedPages.length - 50} more pages_\n`;
            }
            body += '\n';
          }

          body += `📎 Full HTML report available as a [build artifact](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n`;

          const marker = '<!-- docs-diff-report -->';
          body = marker + '\n' + body;

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });

          const existing = comments.find(c => c.body.includes(marker));

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }
